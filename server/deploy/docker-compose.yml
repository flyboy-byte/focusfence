# Focus Fence accountability server.
#   cp .env.example .env        # then edit it
#   docker compose up -d                       # server on 127.0.0.1:8080 only (put your own TLS proxy in front)
#   docker compose --profile https up -d       # also run Caddy: automatic HTTPS for FF_DOMAIN on ports 80/443
# The Android app only talks to https:// servers, so a real deployment needs one of those two TLS routes.
name: focusfence

services:
  server:
    image: ghcr.io/flyboy-byte/focusfence-server:${FF_VERSION:-latest}
    # `docker compose up --build` builds from source instead of pulling the published image.
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FF_DATA_DIR: /data
      FF_HOST: 0.0.0.0
      FF_PORT: "8080"
      # The proxy is another container, so its address is on the compose network, not loopback. Only these
      # ranges may set X-Forwarded-For (it picks the rate-limit bucket); keep it to private ranges.
      FF_TRUSTED_PROXIES: ${FF_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    volumes:
      - ff-data:/data
    ports:
      - "127.0.0.1:${FF_LOCAL_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FF_DOMAIN: ${FF_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  ff-data:
  caddy-data:
  caddy-config:
