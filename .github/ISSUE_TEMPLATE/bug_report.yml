name: Bug report
description: Something in Focus Fence AC or its server doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Don't paste logs, log exports, screenshots or anything that shows what you browse,
        who your partners are, or your server's address. Versions and a numbers-only summary are enough to start.
        The app's Settings → Report a bug fills in the version fields for you.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? Include any message the app showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open Partners
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → What's new, or filled in by Report a bug.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
  - type: textarea
    id: summary
    attributes:
      label: Numbers-only summary (optional)
      description: Filled in by Report a bug if you ticked it. Battery, DNS and error counts only.
      render: text
