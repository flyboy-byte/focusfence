name: Feedback
description: What you think of Focus Fence AC: what works, what's confusing, what you'd change.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Don't include logs, screenshots or anything that shows what you browse.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Phone and Android version
