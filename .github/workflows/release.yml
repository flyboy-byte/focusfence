name: Release

# Cuts a signed release APK when you push a tag like v2.1.3-accountable.
#
# Signing:
#  - If the repo has the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS /
#    KEY_PASSWORD secrets, the APK is signed with that stable key, so each new
#    release installs over the previous one.
#  - Otherwise a throwaway key is generated for this build. It still installs,
#    but a newer build can't install over an older one (uninstall first).
# The release notes say which key was used and its SHA-256 fingerprint.
#
# Tags containing -rc, -beta or -test publish as pre-releases; anything else is a
# full release and becomes "Latest".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            {
              echo "KEYSTORE_FILE=$ks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "SIGNING_KIND=stable"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$ks" \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-release -keypass ci-release \
              -dname "CN=Focus Fence AC, O=focusfence"
            {
              echo "KEYSTORE_FILE=$ks"
              echo "KEYSTORE_PASSWORD=ci-release"
              echo "KEY_ALIAS=ci"
              echo "KEY_PASSWORD=ci-release"
              echo "SIGNING_KIND=throwaway"
            } >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Verify signature and name the APK
        run: |
          apk="focus-fence-accountable-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Fails the job if the APK isn't validly signed.
          "$signer" verify --print-certs "$apk" | tee signer.txt
          fp=$(grep -m1 'SHA-256 digest' signer.txt | awk '{print $NF}')
          echo "CERT_SHA256=$fp" >> "$GITHUB_ENV"

      - name: Release type
        run: |
          case "${{ github.ref_name }}" in
            *-rc*|*-beta*|*-test*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
          name: "Focus Fence AC ${{ github.ref_name }}"
          files: focus-fence-accountable-*.apk
          body: |
            **Focus Fence AC** — accountability build, separate from the original Focus Fence.

            - App id `app.focusfence.accountable` (installs alongside the original)
            - Signing key: **${{ env.SIGNING_KIND }}** (cert SHA-256 `${{ env.CERT_SHA256 }}`)
              - stable: installs over earlier stable releases
              - throwaway: uninstall the previous build first
            - Works on its own (filtering, logs, uninstall protection). Partner reports are optional and need a Focus Fence server (see `server/README.md`).
            - Status of every feature, and how far it's been tested: `STATE.md` on the branch.
