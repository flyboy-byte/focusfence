name: Release

# Cuts a signed release when you push a tag like v2.1.0-accountable.
# Requires four repo secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK by tag
        run: cp app/build/outputs/apk/release/app-release.apk "focus-fence-accountable-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "Focus Fence AC ${{ github.ref_name }}"
          files: focus-fence-accountable-*.apk
          body: |
            **Focus Fence AC** — accountability build, separate from the original Focus Fence.

            - App id `app.focusfence.accountable` (installs alongside the original, does not replace it)
            - Release-signed APK attached below
            - Pre-release: not device-tested across OEMs yet
