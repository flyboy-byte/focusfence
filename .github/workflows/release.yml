name: Release

# Cuts an UNSIGNED release APK when you push a tag like v2.1.0-accountable.
# No secrets needed. An unsigned APK must be signed before it can be installed
# (see the release notes), or add signing secrets and restore the signing step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Generate a signing key for this build
        # No repo secrets needed: a key is generated per build so the published
        # APK installs directly. Trade-off: the key differs each build, so to
        # install a newer build over an older one, uninstall the old first.
        # For stable updates, add KEYSTORE_* secrets and sign with those instead.
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-release -keypass ci-release \
            -dname "CN=Focus Fence AC, O=focusfence"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ci-release
          KEY_ALIAS: ci
          KEY_PASSWORD: ci-release
        run: ./gradlew assembleRelease

      - name: Name the APK by tag
        run: cp app/build/outputs/apk/release/app-release.apk "focus-fence-accountable-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "Focus Fence AC ${{ github.ref_name }}"
          files: focus-fence-accountable-*.apk
          body: |
            **Focus Fence AC** — accountability build, separate from the original Focus Fence.

            - App id `app.focusfence.accountable` (installs alongside the original)
            - Signed and installable directly. The signing key is generated per
              build, so to install a newer build over an older one, uninstall the
              old first. Add KEYSTORE_* secrets to sign with a stable key instead.
            - Pre-release: not device-tested across OEMs yet.
