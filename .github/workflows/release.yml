name: Release

# Cuts an UNSIGNED release APK when you push a tag like v2.1.0-accountable.
# No secrets needed. An unsigned APK must be signed before it can be installed
# (see the release notes), or add signing secrets and restore the signing step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Name the APK by tag
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "focus-fence-accountable-${{ github.ref_name }}-unsigned.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "Focus Fence AC ${{ github.ref_name }}"
          files: focus-fence-accountable-*-unsigned.apk
          body: |
            **Focus Fence AC** — accountability build, separate from the original Focus Fence.

            - App id `app.focusfence.accountable` (installs alongside the original)
            - **Unsigned** release APK. Android will not install it until it is signed.
              Sign it with your own key, e.g.:
              `apksigner sign --ks your.jks --out focus-fence-accountable-signed.apk focus-fence-accountable-*-unsigned.apk`
            - Pre-release: not device-tested across OEMs yet.
