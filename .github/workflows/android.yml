name: Android CI

# Once per change (D-043): pushes to main, and pull requests. A branch push without a PR runs nothing.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI builds and tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Plan 15: public docs must not describe removed features (list in the script).
      - name: Check docs for removed features
        run: python3 tools/check_docs.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The classifier is copied out with AssetManager.openFd, which fails on a
      # compressed asset. Fail the build rather than ship an AI that can't load.
      - name: Check bundled AI model is present and stored uncompressed
        run: |
          unzip -v app/build/outputs/apk/debug/app-debug.apk | tee apk-list.txt | grep classifier/
          grep -E "Stored .*assets/classifier/nsfw_mobilenet_v2_f16.tflite" apk-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-fence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # The accountability backend prototype. It compiles the phone's pure dns/ code
  # too, so this also proves that code stays free of Android types.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test server
        run: ./gradlew -p server test --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/
