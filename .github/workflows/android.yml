name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      # A missing mapping file means R8 silently didn't run, which would mean the
      # release build is no longer being minified — cheap to check, easy to miss.
      - name: Verify R8 ran
        run: test -f app/build/outputs/mapping/release/mapping.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-fence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Globbed on purpose: the output is app-release-unsigned.apk until a
      # signingConfig exists (W4), and app-release.apk afterwards.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-fence-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Without this, a stack trace from a minified build is unreadable.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: focus-fence-release-mapping
          path: app/build/outputs/mapping/release/
