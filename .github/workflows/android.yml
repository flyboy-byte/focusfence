name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a GitHub Release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # The release key lives only in repository secrets. Pull requests from forks don't
      # get secrets, so they fall through to a debug build instead of failing.
      - name: Decode release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSFENCE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::FOCUSFENCE_KEYSTORE_BASE64 secret not set; building a debug APK instead of a signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FOCUSFENCE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          FOCUSFENCE_KEYSTORE_PASSWORD: ${{ secrets.FOCUSFENCE_KEYSTORE_PASSWORD }}
          FOCUSFENCE_KEY_ALIAS: ${{ secrets.FOCUSFENCE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          # Fail loudly rather than publish an unsigned APK if the secrets are wrong.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist && cp "$apk" "dist/focus-fence-$version.apk"

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug
          mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/focus-fence-debug.apk

      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'focus-fence-apk' || 'focus-fence-debug-apk' }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
